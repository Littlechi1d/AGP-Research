[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agp-research"
version = "0.1.0"
description = "A small, reproducible query-adaptive graph propagation research prototype"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agp = "agp_research.cli:main"

[tool.setuptools.packages.find]
include = ["agp_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

